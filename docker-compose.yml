version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9092


  db:
    container_name: library-management-postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: library_management_db
    ports:
      - "5434:5432"

  identity_db:
    container_name: identity_db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"

  redis:
    image: redis
    container_name: library-management-redis
    restart: always
    volumes:
      - redis_volume_data:/data
    ports:
      - "6380:6379"

  book-service:
    image: dockerfile-bookservice:0.0.1
    ports:
      - "8083:8083"
    depends_on:
      - db
      - redis
      - discoveryservice
      - identity-service
      - shared-service

  book-order-service:
    image: dockerfile-orderservice:0.0.1
    ports:
      - "8084:8084"
    environment:
      - GRPC_AUTH_USER_SERVICE=auth_user_service:9090
    depends_on:
      - db
      - discoveryservice
      - auth_user-service
      - identity-service
      - shared-service

  auth_user-service:
    image: dockerfile-auth_user:0.0.1
    ports:
      - "8085:8085"
      - "9090:9090"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka:9094
    depends_on:
      - kafka
      - zookeeper
      - db
      - discoveryservice
      - identity-service
      - shared-service

  discoveryservice:
    image: dockerfile-discoveryservice:0.0.1
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discoveryservice
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: discoveryservice
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"

  api-gateway:
    image: dockerfile-apigateway:0.0.1
    ports:
      - "8082:8082"
    depends_on:
      - discoveryservice
      - identity-service
      - shared-service

  identity-service:
    image: dockerfile-identity:0.0.1
    ports:
      - "8088:8088"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092,kafka:9094
    depends_on:
      - kafka
      - zookeeper
      - identity_db
      - discoveryservice

  shared-service:
    image: dockerfile-shared:0.0.1
    ports:
      - "8086:8086"
    depends_on:
      - db
      - identity_db
      - discoveryservice

volumes:
  redis_volume_data: